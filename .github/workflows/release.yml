name: Build & Release

# Trigger saat push tag versi (v*) atau manual lewat tombol Run workflow (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag versi yang ingin dirilis (misal: v1.3.0, default: otomatis dari package.json)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            builder_args: --win --publish=never
            artifact_name: win-artifacts
            artifact_paths: |
              release/*.exe
              release/*.blockmap
              release/latest*.yml

          - platform: macOS
            runner: macos-latest
            builder_args: --mac --x64 --arm64 --publish=never
            artifact_name: mac-artifacts
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac*.yml

          - platform: Linux
            runner: ubuntu-latest
            builder_args: --linux AppImage deb --x64 --publish=never
            artifact_name: linux-artifacts
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap
              release/latest-linux*.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Quality gate: cegah release jika ada error kompilasi TypeScript
      - name: Typecheck (Quality Gate)
        run: npm run typecheck

      # electron-vite build menghasilkan out/main, out/preload, out/renderer
      - name: Build application (main, preload, renderer)
        run: npm run build

      # Packaging installer mandiri per platform (electron-builder)
      - name: Package application (electron-builder)
        run: npx electron-builder ${{ matrix.builder_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload installer dan metadata pembaruan ke artifact storage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_paths }}

  release:
    name: Create or Update GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        shell: bash
        run: |
          # 1. Tentukan tag rilis (prioritas: input manual -> git tag -> versi package.json)
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              PKG_VER=$(node -p "require('./package.json').version")
              TAG="v${PKG_VER}"
            fi
          fi

          echo "Memproses rilis untuk Tag: $TAG"

          # 2. Kumpulkan berkas installer binary dari semua platform
          mapfile -d '' assets < <(find ./artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.blockmap" -o \
            -name "latest*.yml" \
          \) -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "Error: Tidak ada artifact yang ditemukan untuk di-upload." >&2
            exit 1
          fi

          printf 'Aset yang akan di-upload ke release:\n%s\n' "${assets[@]}"

          # 3. Ekstrak release notes dari CHANGELOG.md
          NOTES_FILE="release_notes.txt"
          node scripts/extract-release-notes.cjs "$TAG" "$NOTES_FILE"

          # 4. Buat atau perbarui release secara idempotent (aman jika re-run)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada. Mengunggah ulang aset dengan --clobber..."
            gh release upload "$TAG" "${assets[@]}" --repo "${{ github.repository }}" --clobber
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$NOTES_FILE"
            fi
          else
            echo "Membuat release baru $TAG..."
            if [ -s "$NOTES_FILE" ]; then
              gh release create "$TAG" "${assets[@]}" \
                --repo "${{ github.repository }}" \
                --title "Release $TAG" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" "${assets[@]}" \
                --repo "${{ github.repository }}" \
                --title "Release $TAG" \
                --generate-notes
            fi
          fi

          echo "Rilis $TAG berhasil dipublikasikan!"
