name: Build & Release

# Trigger saat push tag versi (v*) atau manual lewat tombol Run workflow (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: macOS
            runner: macos-latest
          - platform: Linux
            runner: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build application (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            npx tauri build --target universal-apple-darwin
          else
            npx tauri build
          fi
        shell: bash

      - name: Collect signed release bundles
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const outDir = path.resolve("dist-artifacts");
            fs.mkdirSync(outDir, { recursive: true });
            const exts = [".exe", ".msi", ".dmg", ".app.tar.gz", ".AppImage", ".rpm", ".deb", ".sig"];
            const bundleMarker = path.sep + "release" + path.sep + "bundle" + path.sep;
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name.endsWith(".app")) continue;
                  walk(full);
                } else if (entry.isFile()) {
                  if (!full.includes(bundleMarker)) continue;
                  if (exts.some((ext) => entry.name.endsWith(ext))) {
                    fs.copyFileSync(full, path.join(outDir, entry.name));
                    console.log("Collected:", entry.name);
                  }
                }
              }
            }
            walk(path.resolve("src-tauri/target"));
          '

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: error

  build-android:
    name: Build (Android)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Rust stable (Android aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Decode Android Release Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/nitirekso-release.jks

      - name: Build Android APK (aarch64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/nitirekso-release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk --target aarch64

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: rm -f /tmp/nitirekso-release.jks

      - name: Collect Android APK artifact
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const outDir = path.resolve("dist-artifacts");
            fs.mkdirSync(outDir, { recursive: true });
            const apkRoot = path.resolve("src-tauri/gen/android/app/build/outputs/apk");
            const found = [];
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.isFile() && entry.name.endsWith(".apk")) found.push(full);
              }
            }
            walk(apkRoot);
            const chosen = found.find((p) => !p.includes("unsigned")) || found[0];
            if (!chosen) {
              throw new Error("APK release tidak ditemukan di " + apkRoot);
            }
            const targetName = `nitirekso_${pkg.version}_arm64-v8a.apk`;
            fs.copyFileSync(chosen, path.join(outDir, targetName));
            console.log("Collected Android APK:", targetName, "from", chosen);
          '

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-Android
          path: dist-artifacts/*
          if-no-files-found: error

  publish:
    name: Generate Manifests & Publish Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate latest.json and SHA256SUMS.txt
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          printf '%s' "$TAG" > /tmp/release_tag.txt

          node scripts/generate-release-manifests.mjs \
            --dir release-artifacts \
            --out release-manifests \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --changelog CHANGELOG.md \
            --notes-out /tmp/release_notes.md

      - name: Publish assets and manifests to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="$(cat /tmp/release_tag.txt)"
          mkdir -p upload-assets
          find release-artifacts -type f -exec cp -f {} upload-assets/ \;
          cp -f release-manifests/latest.json upload-assets/latest.json
          cp -f release-manifests/SHA256SUMS.txt upload-assets/SHA256SUMS.txt

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "nitirekso $TAG" \
              --notes-file /tmp/release_notes.md
          fi

          gh release upload "$TAG" upload-assets/* --repo "${{ github.repository }}" --clobber
